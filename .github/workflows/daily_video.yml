name: Evcarix Ultra-HD Pipeline v2

on:
  schedule:
    - cron: '0 12 * * 5'   # Sadece Cuma GÃ¼nleri TSÄ° 15:00 â€” Otomatik HaftalÄ±k Uzun Video + Short
  workflow_dispatch:
    inputs:
      video_type:
        description: 'Video formatÄ±'
        required: true
        default: 'short'
        type: choice
        options:
          - short
          - long
      content_mode:
        description: 'Ä°Ã§erik modu'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - trend
          - educational
          - scientific
          - ev_news
          - electric vehicles
          - artificial intelligence
          - robotics
          - new technologies
          - battery systems
          - smart cities
          - devices of the future
      use_bg_music:
        description: 'Arka plan mÃ¼ziÄŸi ekle (Ã¼cretsiz, CC-BY)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      forced_topic:
        description: 'Short iÃ§in zorunlu konu (boÅŸ = otomatik seÃ§). Ã–rn: Humanoid Robots 2025 Goldman Sachs Report'
        required: false
        default: ''
        type: string

jobs:
  produce-video:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        slot: [1]  # [1, 2] yaparak paralel 2 video Ã¼retilebilir (dikkat: 2x sÃ¼re)
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PYTHONUNBUFFERED: 1
      USE_BG_MUSIC: ${{ github.event.inputs.use_bg_music || 'true' }}

    steps:
      # â”€â”€ 1. Checkout â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      # â”€â”€ 2. Python Kurulum â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Set up Python 3.11
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'

      # â”€â”€ 3. APT Cache â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Cache APT packages
        uses: actions/cache@v4.2.0
        with:
          path: /var/cache/apt/archives
          key: apt-ffmpeg-fonts-${{ runner.os }}-noble-v2

      # â”€â”€ 4. Sistem BaÄŸÄ±mlÄ±lÄ±klarÄ± â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Install System Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            ffmpeg \
            fonts-liberation \
            fonts-dejavu-core \
            fonts-noto \
            imagemagick \
            libsm6 libxext6 libxrender-dev

      # â”€â”€ 5. Python BaÄŸÄ±mlÄ±lÄ±klarÄ± â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt

      - name: ğŸ› ï¸ Fix ImageMagick Security Policy
        run: |
          sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml
          echo "âœ… ImageMagick policy fixed"

      # â”€â”€ 6. HuggingFace Model Cache â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Restore HuggingFace Model Cache
        uses: actions/cache@v4.2.0
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ runner.os }}-v2
          restore-keys: hf-models-${{ runner.os }}-

      # â”€â”€ 7. Ses/MÃ¼zik Cache â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Restore Audio Cache
        uses: actions/cache@v4.2.0
        with:
          path: assets/audio_cache
          key: audio-cache-${{ runner.os }}-v1
          restore-keys: audio-cache-${{ runner.os }}-

      # â”€â”€ 8. Ä°Ã§erik GeÃ§miÅŸi Cache â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Restore History Cache
        uses: actions/cache@v4.2.0
        with:
          path: |
            content_history.json
            used_topics.json
            sequential_state.json
            used_clips.json
            used_videos.json
            license_log.json
            topic_queue.json
          key: evcarix-history-v2-${{ github.run_id }}
          restore-keys: |
            evcarix-history-v2-
            evcarix-history-

      # â”€â”€ 9. SÄ±rlar Ayarla â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Setup Secrets
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
        run: python3 src/setup_secrets.py

      # â”€â”€ 10. Content Mode Belirle â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Set Content Mode
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            INPUT_MODE="${{ github.event.inputs.content_mode }}"
            # Manuel tetiklemede 'auto' seÃ§ilirse trend moduna yÃ¼kselt
            # â€” her manuel video yayÄ±nlanÄ±r yayÄ±nlanmaz en gÃ¼ncel trendlerden Ã¼retilsin
            if [ "$INPUT_MODE" == "auto" ] || [ -z "$INPUT_MODE" ]; then
              echo "CONTENT_MODE=trend" >> $GITHUB_ENV
            else
              echo "CONTENT_MODE=$INPUT_MODE" >> $GITHUB_ENV
            fi
            echo "VIDEO_TYPE=${{ github.event.inputs.video_type }}" >> $GITHUB_ENV
            echo "FORCED_TOPIC=${{ github.event.inputs.forced_topic }}" >> $GITHUB_ENV
            echo "FORCE_FRESH_TREND=true" >> $GITHUB_ENV
          else
            # Otomatik zamanlama (Sadece Cuma GÃ¼nleri TSÄ° 15:00 â€” Long Video + Short)
            echo "CONTENT_MODE=trend" >> $GITHUB_ENV
            echo "VIDEO_TYPE=long" >> $GITHUB_ENV
            echo "FORCE_FRESH_TREND=true" >> $GITHUB_ENV
          fi
          echo "âœ… Content Mode: $CONTENT_MODE"
          echo "âœ… Video Type: $VIDEO_TYPE"

      # â”€â”€ 11. Video Ãœretimi â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: âš¡ Production Run (Auto-Monitor)
        timeout-minutes: 110
        env:
          # LLM
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # GÃ¶rsel Kaynaklar
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          # Ses (isteÄŸe baÄŸlÄ± â€” Ã¼cretli kaynaklar API key gerektirmez)
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
          # HuggingFace (Kokoro TTS + SDXL)
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # YouTube Upload
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # AI Video Generative Keys
          SEEDANCE_API_KEY: ${{ secrets.SEEDANCE_API_KEY }}
          PIXVERSE_API_KEY: ${{ secrets.PIXVERSE_API_KEY }}
          VIDU_API_KEY: ${{ secrets.VIDU_API_KEY }}
          MUAPI_KEY: ${{ secrets.MUAPI_KEY }}
          VIDEOGEN_API_KEY: ${{ secrets.VIDEOGEN_API_KEY }}
          ZSKY_API_KEY: ${{ secrets.ZSKY_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          KLING_API_KEY: ${{ secrets.KLING_API_KEY }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          UPLOAD_SLOT: ${{ matrix.slot == 1 && 'evening' || 'night' }}
          USE_BG_MUSIC: ${{ github.event.inputs.use_bg_music || 'true' }}
          # GitHub Actions flag
          CI: 'true'
          GITHUB_ACTIONS: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "=== EVCARIX PIPELINE v2 START ==="
          echo "Video Type : $VIDEO_TYPE"
          echo "Content Mode: $CONTENT_MODE"
          echo "BG Music   : $USE_BG_MUSIC"
          python3 main.py

      # â”€â”€ 12. GeÃ§miÅŸ Cache Kaydet â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Save History Cache
        if: always()
        uses: actions/cache/save@v4.2.0
        with:
          path: |
            content_history.json
            used_topics.json
            sequential_state.json
            used_clips.json
            used_videos.json
            license_log.json
            topic_queue.json
          key: evcarix-history-v2-${{ github.run_id }}

      # â”€â”€ 13. Ses Cache Kaydet â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Save Audio Cache
        if: always()
        uses: actions/cache/save@v4.2.0
        with:
          path: assets/audio_cache
          key: audio-cache-${{ runner.os }}-v1

      # â”€â”€ 14. Artifact YÃ¼kle â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4.4.0
        with:
          name: video-output-slot${{ matrix.slot }}-run${{ github.run_number }}
          path: |
            output/
            license_log.json
          retention-days: 7

      # â”€â”€ 15. Temizlik Ã–zeti â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      - name: Pipeline Summary
        if: always()
        run: |
          echo "### Evcarix Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Video Type | $VIDEO_TYPE |" >> $GITHUB_STEP_SUMMARY
          echo "| Content Mode | $CONTENT_MODE |" >> $GITHUB_STEP_SUMMARY
          echo "| BG Music | $USE_BG_MUSIC |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          if [ -d output ]; then
            VIDEO_COUNT=$(find output -name "*.mp4" | wc -l)
            echo "| Videos Produced | $VIDEO_COUNT |" >> $GITHUB_STEP_SUMMARY
            find output -name "*.mp4" -exec du -sh {} \; >> $GITHUB_STEP_SUMMARY || true
          fi
          if [ -f license_log.json ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### License Log" >> $GITHUB_STEP_SUMMARY
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat license_log.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
